<script>
function switchTab(idx) {
  document.querySelectorAll('.pageframe').forEach((f, i) => {
    f.style.display = (i === idx) ? 'block' : 'none';
  });
  document.querySelectorAll('.tabbtn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
}
</script>
